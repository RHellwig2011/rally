[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schoolscraper"
version = "0.5.0"
description = "Scrape Schoology and PowerSchool, surface upcoming work, and generate study material."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "requests-oauthlib>=2.0.0",
    "playwright>=1.45.0",
    "python-dotenv>=1.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "python-dateutil>=2.9.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "apscheduler>=3.10.4",
    "cryptography>=42.0.0",
    "ask-sdk-core>=1.19.0",
    "ask-sdk-webservice-support>=1.0.0",
]

[project.scripts]
schoolscraper = "schoolscraper.cli:app"

[tool.setuptools.packages.find]
include = ["schoolscraper*"]
